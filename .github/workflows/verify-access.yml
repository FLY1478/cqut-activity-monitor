name: Single-user cloud end-to-end test
run-name: Read-only school scan and one WeChat summary
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: single-user-cloud-e2e-test
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.18.0'
      - run: npm ci --ignore-scripts
      - run: npm run check && npm test
      - name: Read-only scan, process restart and one notification
        env:
          CQUT_CHROMIUM_PATH: /usr/bin/google-chrome
          CQUT_E2E_CONFIG: ${{ secrets.CQUT_E2E_CONFIG }}
          CQUT_E2E_STORAGE_KEY: ${{ secrets.CQUT_E2E_STORAGE_KEY }}
        run: xvfb-run -a node --disable-warning=ExperimentalWarning src/cloud-e2e.ts
      - name: Remove ephemeral browser profiles and encrypted private files
        if: always()
        run: node --disable-warning=ExperimentalWarning src/cloud-e2e.ts --cleanup
