name: Verify school access
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: school-access-probe
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - run: npm ci
      - run: npm run check && npm test
      - run: npx playwright install --with-deps chromium
      - name: Verify isolated cloud authentication
        env:
          CQUT_USERNAME: ${{ secrets.CQUT_USERNAME }}
          CQUT_PASSWORD: ${{ secrets.CQUT_PASSWORD }}
          CQUT_STORAGE_KEY: ${{ secrets.CQUT_STORAGE_KEY }}
          CQUT_PRIVATE_DIR: .private
          CQUT_REPORT_PATH: .private/access-report.json
        run: |
          export CQUT_CHROMIUM_PATH="$(node -e 'console.log(require("playwright").chromium.executablePath())')"
          xvfb-run -a npm run probe -- --normal-browser
