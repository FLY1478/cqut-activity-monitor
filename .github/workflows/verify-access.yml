name: Anonymous browser compatibility
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: anonymous-browser-compatibility
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.18.0'
      - run: npm ci --ignore-scripts
      - name: Verify sandbox report parsing
        run: node --test scripts/cloud-compat/sandbox-status.test.mjs
      - name: Read-only browser and anonymous school entry
        env:
          CQUT_PROBE_CHROME_PATH: /usr/bin/google-chrome
          CQUT_PROBE_RESULT_PATH: probe-result.json
        run: xvfb-run -a node scripts/cloud-compat/anonymous-browser.mjs
      - name: Require every compatibility check
        if: always()
        run: |
          test -f probe-result.json
          node scripts/cloud-compat/verify-report.mjs
      - name: Emit bounded anonymous report
        if: always()
        run: |
          if [ -f probe-result.json ]; then cat probe-result.json; fi
