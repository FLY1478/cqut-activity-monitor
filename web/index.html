<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>二课 · 活动手册</title><link rel="stylesheet" href="/style.css"><script src="/app.js" defer></script></head><body>
<header><div><span class="brand">二课 / 活动手册</span><h1>今日活动</h1><p id="profile">正在打开你的本机记录…</p></div><div id="health" class="health" role="status"></div></header>
<main><section class="toolbar"><div id="stats"></div><label>显示活动 <select id="filter"><option value="available">可报名及即将开放</option><option value="all">所有活动</option><option value="simple">简单／中等活动</option><option value="unknown">资格待核实</option></select></label></section><p class="fold-hint">点击卡片，展开详情与报名</p><p id="notice" class="notice" role="status"></p><section id="activities" aria-label="活动列表"></section></main>
<dialog id="signup"><form id="signup-form"><h2 id="signup-title">模拟报名</h2><p id="signup-help"></p><img id="captcha-image" alt="学校数字验证码"><label>数字验证码 <input id="captcha" inputmode="numeric" autocomplete="off" pattern="[0-9]{1,8}" required></label><label class="check"><input id="confirm" type="checkbox" required><span id="confirm-label"></span></label><p id="signup-result" role="status"></p><div class="actions"><button id="submit-signup" type="submit">一键报名 · 模拟</button><button id="close-signup" type="button" class="secondary">关闭</button></div></form></dialog>
</body></html>
